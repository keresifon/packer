name: Build Amazon Linux 2023 Golden Image

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS region'
        required: false
        default: 'us-east-1'
        type: string
      aws_role_arn:
        description: 'IAM role ARN for OIDC authentication'
        required: false
        default: ''
        type: string
      iam_instance_profile:
        description: 'IAM instance profile name for SSM (optional - Packer can create temporary one)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - aws-packer-cis
    paths:
      - '*.pkr.hcl'
      - '.github/workflows/**'
  pull_request:
    branches:
      - aws-packer-cis

env:
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || github.event.inputs.aws_role_arn || '' }}
  PKR_VAR_aws_region: ${{ github.event.inputs.aws_region || 'us-east-1' }}
  PKR_VAR_iam_instance_profile: ${{ vars.IAM_INSTANCE_PROFILE || github.event.inputs.iam_instance_profile || '' }}
  PKR_VAR_vpc_id: ${{ vars.VPC_ID || '' }}
  PKR_VAR_subnet_id: ${{ vars.SUBNET_ID || '' }}
  PKR_VAR_cis_s3_bucket: ${{ vars.CIS_S3_BUCKET || '' }}
  PKR_VAR_cis_s3_prefix: ${{ vars.CIS_S3_PREFIX || 'cis-tools' }}
  PKR_VAR_enable_cis_hardening: ${{ vars.ENABLE_CIS_HARDENING || 'true' }}
  PACKER_VERSION: ${{ vars.PACKER_VERSION || '1.14.3' }}

jobs:
  validate:
    name: Validate Packer Template
    runs-on: terraform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup user bin directory
        run: |
          mkdir -p ~/bin ~/.local/bin
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$HOME/.local/bin:$PATH"

      - name: Setup Packer
        run: |
          PACKER_VERSION="${PACKER_VERSION:-1.14.3}"
          if command -v packer >/dev/null 2>&1; then
            INSTALLED_VERSION=$(packer version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ "$INSTALLED_VERSION" = "$PACKER_VERSION" ]; then
              echo "✅ Packer ${PACKER_VERSION} already installed"
              packer version
              exit 0
            else
              echo "⚠️  Packer ${INSTALLED_VERSION} installed, but ${PACKER_VERSION} required. Reinstalling..."
            fi
          fi
          # Remove old packer binary if it exists
          rm -f ~/bin/packer
          
          if [ -f "bin/packer_${PACKER_VERSION}_linux_amd64.zip" ]; then
            unzip -o -q "bin/packer_${PACKER_VERSION}_linux_amd64.zip" -d ~/bin/
          else
            echo "Downloading Packer ${PACKER_VERSION}..."
            curl -fsSL "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip" -o /tmp/packer.zip
            unzip -o -q /tmp/packer.zip -d ~/bin/
            rm /tmp/packer.zip
          fi
          chmod +x ~/bin/packer
          packer version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.PKR_VAR_aws_region }}

      - name: Initialize Packer
        run: packer init aws-golden-image.pkr.hcl

      - name: Validate Packer template
        run: packer validate aws-golden-image.pkr.hcl

  build:
    name: Build AMI
    needs: validate
    runs-on: terraform
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    outputs:
      ami_id: ${{ steps.build_ami.outputs.AMI_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup user bin directory
        run: |
          mkdir -p ~/bin ~/.local/bin
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Packer
        run: |
          PACKER_VERSION="${PACKER_VERSION:-1.14.3}"
          if command -v packer >/dev/null 2>&1; then
            INSTALLED_VERSION=$(packer version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ "$INSTALLED_VERSION" = "$PACKER_VERSION" ]; then
              echo "✅ Packer ${PACKER_VERSION} already installed"
          packer version
              exit 0
            else
              echo "⚠️  Packer ${INSTALLED_VERSION} installed, but ${PACKER_VERSION} required. Reinstalling..."
            fi
          fi
          # Remove old packer binary if it exists
          rm -f ~/bin/packer
          
          if [ -f "bin/packer_${PACKER_VERSION}_linux_amd64.zip" ]; then
            unzip -o -q "bin/packer_${PACKER_VERSION}_linux_amd64.zip" -d ~/bin/
          else
            echo "Downloading Packer ${PACKER_VERSION}..."
            curl -fsSL "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip" -o /tmp/packer.zip
            unzip -o -q /tmp/packer.zip -d ~/bin/
            rm /tmp/packer.zip
          fi
          chmod +x ~/bin/packer
          packer version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.PKR_VAR_aws_region }}

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml --force
          ansible --version

      - name: Initialize Packer
        run: packer init aws-golden-image.pkr.hcl

      - name: Build Packer image
        id: build_ami
        run: |
          PACKER_OUTPUT_FILE=$(mktemp)
          PACKER_BUILD_CMD="packer build -var=\"aws_region=${{ env.PKR_VAR_aws_region }}\""
          [ -n "${{ env.PKR_VAR_iam_instance_profile }}" ] && PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var=\"iam_instance_profile=${{ env.PKR_VAR_iam_instance_profile }}\""
          [ -n "${{ env.PKR_VAR_vpc_id }}" ] && PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var=\"vpc_id=${{ env.PKR_VAR_vpc_id }}\""
          [ -n "${{ env.PKR_VAR_subnet_id }}" ] && PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var=\"subnet_id=${{ env.PKR_VAR_subnet_id }}\""
          [ -n "${{ env.PKR_VAR_cis_s3_bucket }}" ] && PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var=\"cis_s3_bucket=${{ env.PKR_VAR_cis_s3_bucket }}\""
          [ -n "${{ env.PKR_VAR_cis_s3_prefix }}" ] && PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var=\"cis_s3_prefix=${{ env.PKR_VAR_cis_s3_prefix }}\""
          [ -n "${{ env.PKR_VAR_enable_cis_hardening }}" ] && PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var=\"enable_cis_hardening=${{ env.PKR_VAR_enable_cis_hardening }}\""
          SECURITY_GROUP_IDS="${{ vars.SECURITY_GROUP_IDS }}"
          if [ -n "$SECURITY_GROUP_IDS" ]; then
            SG_HCL=$(echo "$SECURITY_GROUP_IDS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/^/"/;s/$/"/' | tr '\n' ',' | sed 's/,$//' | sed 's/^/[/;s/$/]/')
            VAR_FILE=$(mktemp --suffix=.hcl)
            echo "security_group_ids = $SG_HCL" > "$VAR_FILE"
            PACKER_BUILD_CMD="${PACKER_BUILD_CMD} -var-file=$VAR_FILE"
          fi
          PACKER_BUILD_CMD="${PACKER_BUILD_CMD} aws-golden-image.pkr.hcl"
          
          # Run Packer build and capture output
          set +e  # Don't exit on Packer errors - we'll check exit code manually
          eval $PACKER_BUILD_CMD 2>&1 | tee "$PACKER_OUTPUT_FILE"
          PACKER_EXIT=${PIPESTATUS[0]}
          set -e  # Re-enable exit on error

          echo ""
          echo "=== Packer Build Summary ==="
          echo "Packer exit code: $PACKER_EXIT"
          
          # Extract AMI ID from Packer's success output
          # Packer outputs specific patterns when AMI is created:
          # - "AMIs were created:" followed by "us-east-1: ami-xxxxxxxxxxxxxxxxx"
          # - "Creating AMI ... from instance" followed by "AMI: ami-xxxxx"
          # - "us-east-1: ami-xxxxxxxxxxxxxxxxx" (in success section)
          
          # Primary: Look for "AMIs were created" pattern (most reliable)
          AMI_ID=$(grep -iE "AMIs were created" -A 5 "$PACKER_OUTPUT_FILE" | grep -oE '[a-z0-9-]+: ami-[0-9a-f]{17}' | grep -oE 'ami-[0-9a-f]{17}' | tail -1)
          
          # Secondary: Look for "Creating AMI" followed by "AMI: ami-xxx"
          if [ -z "$AMI_ID" ]; then
            AMI_ID=$(grep -iE "Creating AMI.*from instance" -A 10 "$PACKER_OUTPUT_FILE" | grep -iE "^.*AMI: ami-[0-9a-f]{17}" | grep -oE 'ami-[0-9a-f]{17}' | tail -1)
          fi
          
          # Tertiary: Look for region: ami-xxx in success context (after "AMIs were created" or "Build finished")
          if [ -z "$AMI_ID" ]; then
            AMI_ID=$(grep -iE "(Builds finished|artifacts of successful)" -A 10 "$PACKER_OUTPUT_FILE" | grep -oE '[a-z0-9-]+: ami-[0-9a-f]{17}' | grep -oE 'ami-[0-9a-f]{17}' | tail -1)
          fi
          
          echo "Extracted AMI ID: ${AMI_ID:-NOT FOUND}"
          
          # If we found an AMI ID, verify it's actually a newly created AMI (not the source AMI)
          if [ -n "$AMI_ID" ]; then
            echo "Verifying extracted AMI ID is a newly created AMI..."
            # Check if AMI exists and was created recently (within last 2 hours)
            AMI_INFO=$(aws ec2 describe-images --image-ids "$AMI_ID" --region "${{ env.PKR_VAR_aws_region }}" --query 'Images[0].[Name,CreationDate,ImageId]' --output text 2>/dev/null || echo "")
            if [ -n "$AMI_INFO" ] && [ "$AMI_INFO" != "None" ]; then
              AMI_NAME=$(echo "$AMI_INFO" | awk '{print $1}')
              AMI_DATE=$(echo "$AMI_INFO" | awk '{print $2}')
              echo "Found AMI: $AMI_ID"
              echo "AMI Name: $AMI_NAME"
              echo "AMI Creation Date: $AMI_DATE"
              
              # Check if AMI name matches our expected pattern (contains "golden-image")
              # Source AMIs have names like "al2023-ami-2024.12.17-kernel-6.1-x86_64"
              # Our AMIs have names like "amazonlinux2023-golden-image-2025-12-17-0205"
              if [[ "$AMI_NAME" == *"golden-image"* ]]; then
                echo "✅ Verified: AMI name '$AMI_NAME' matches expected pattern 'golden-image'"
              elif [[ "$AMI_NAME" == *"al2023-ami"* ]]; then
                # This is likely the source AMI (Amazon Linux base AMI), not our created AMI
                echo "⚠️  WARNING: Extracted AMI name '$AMI_NAME' matches source AMI pattern 'al2023-ami'"
                echo "This is likely the source AMI, not a newly created AMI. Clearing AMI_ID."
                AMI_ID=""
              else
                # Unknown pattern - check creation time as fallback
                # Use Python for reliable date parsing (available on most systems)
                CURRENT_TIME=$(python3 -c "import time; print(int(time.time()))" 2>/dev/null || date +%s)
                AMI_TIME=$(python3 -c "from datetime import datetime; print(int(datetime.strptime('$AMI_DATE', '%Y-%m-%dT%H:%M:%S.%fZ').timestamp()))" 2>/dev/null || echo "0")
                if [ "$AMI_TIME" != "0" ]; then
                  TIME_DIFF=$((CURRENT_TIME - AMI_TIME))
                  MAX_AGE=7200  # 2 hours in seconds
                  if [ $TIME_DIFF -gt $MAX_AGE ]; then
                    echo "⚠️  WARNING: Extracted AMI was created $((TIME_DIFF / 3600)) hours ago (more than 2 hours)"
                    echo "This is likely not a newly created AMI. Clearing AMI_ID."
                    AMI_ID=""
                  else
                    echo "✅ Verified: AMI $AMI_ID was created recently ($((TIME_DIFF / 60)) minutes ago)"
                  fi
                else
                  echo "⚠️  WARNING: Could not parse AMI creation date. Cannot verify if AMI is newly created."
                  echo "Clearing AMI_ID to be safe."
                  AMI_ID=""
                fi
              fi
            else
              echo "⚠️  WARNING: Extracted AMI ID $AMI_ID does not exist in AWS. Clearing AMI_ID."
              AMI_ID=""
            fi
          fi
          
          # Check if Packer actually succeeded
          if [ $PACKER_EXIT -ne 0 ]; then
            echo "❌ Packer build failed with exit code: $PACKER_EXIT"
          echo ""
            echo "Last 100 lines of Packer output:"
            tail -100 "$PACKER_OUTPUT_FILE"
            
            # Even if Packer failed, check if AMI was created (sometimes Packer fails after AMI creation)
            if [ -n "$AMI_ID" ]; then
          echo ""
              echo "Checking if AMI was created despite Packer error..."
              if aws ec2 describe-images --image-ids "$AMI_ID" --region "${{ env.PKR_VAR_aws_region }}" >/dev/null 2>&1; then
                echo "✅ AMI $AMI_ID exists despite Packer error - build partially succeeded"
                echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT
                rm -f "$PACKER_OUTPUT_FILE"
                exit 0
              else
                echo "❌ AMI $AMI_ID does not exist - build failed"
                rm -f "$PACKER_OUTPUT_FILE"
            exit 1
              fi
            else
              echo "❌ No AMI ID found in output - build failed"
              rm -f "$PACKER_OUTPUT_FILE"
              exit 1
            fi
          fi
          
          # Packer succeeded - verify AMI exists
          if [ -z "$AMI_ID" ]; then
            echo "❌ ERROR: Packer reported success but no AMI ID found in output"
            echo "Full Packer output:"
            cat "$PACKER_OUTPUT_FILE"
            rm -f "$PACKER_OUTPUT_FILE"
            exit 1
          fi
          
          # Verify AMI exists in AWS
          echo "Verifying AMI exists in AWS..."
          if aws ec2 describe-images --image-ids "$AMI_ID" --region "${{ env.PKR_VAR_aws_region }}" >/dev/null 2>&1; then
            echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT
            echo "✅ Successfully built and verified AMI: $AMI_ID"
          else
            echo "❌ ERROR: Packer reported success but AMI $AMI_ID does not exist in AWS"
            echo "Region: ${{ env.PKR_VAR_aws_region }}"
            echo "Last 50 lines of Packer output:"
            tail -50 "$PACKER_OUTPUT_FILE"
            rm -f "$PACKER_OUTPUT_FILE"
            exit 1
          fi
          
          rm -f "$PACKER_OUTPUT_FILE"
          exit 0

      - name: Output AMI ID
        if: success()
        run: |
          echo "AMI build completed successfully!"
          echo "AMI ID: ${{ steps.build_ami.outputs.AMI_ID }}"

  cis-assessment:
    name: CIS Compliance Assessment
    needs: build
    runs-on: terraform
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.PKR_VAR_aws_region }}

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r ansible/requirements.yml --force
          ansible-galaxy collection install -r ansible/requirements.yml --force

      - name: Launch EC2 Instance for Assessment
        id: launch_instance
        run: |
          AMI_ID="${{ needs.build.outputs.ami_id }}"
          VPC_ID="${{ env.PKR_VAR_vpc_id }}"
          SUBNET_ID="${{ env.PKR_VAR_subnet_id }}"
          IAM_PROFILE="${{ env.PKR_VAR_iam_instance_profile }}"
          SECURITY_GROUP_IDS="${{ vars.SECURITY_GROUP_IDS }}"
          
          if [ -z "$AMI_ID" ]; then
            echo "ERROR: AMI ID not found from build job"
            exit 1
          fi
          
          if [ -z "$VPC_ID" ] || [ -z "$SUBNET_ID" ]; then
            echo "ERROR: VPC_ID and SUBNET_ID must be set for CIS assessment"
            exit 1
          fi
          
          if [ -n "$SECURITY_GROUP_IDS" ]; then
            SG_ID=$(echo "$SECURITY_GROUP_IDS" | cut -d',' -f1 | tr -d ' ')
          else
            echo "ERROR: SECURITY_GROUP_IDS must be set"
            exit 1
          fi
          
          echo "Launching EC2 instance for CIS assessment..."
          echo "AMI: $AMI_ID"
          echo "Subnet: $SUBNET_ID"
          echo "Security Group: $SG_ID"
          
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type t3.micro \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SG_ID" \
            --iam-instance-profile Name="$IAM_PROFILE" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=cis-assessment-$(date +%s)},{Key=Purpose,Value=CIS-Compliance-Assessment}]" \
            --query 'Instances[0].InstanceId' \
            --output text \
            --region "${{ env.PKR_VAR_aws_region }}")
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: Failed to launch EC2 instance"
            exit 1
          fi
          
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"
          
          # Wait for instance to be running
          echo "Waiting for instance to be running..."
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "${{ env.PKR_VAR_aws_region }}"
          
          # Wait for SSM agent to be ready
          echo "Waiting for SSM agent to be ready..."
          for i in {1..30}; do
            if aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --region "${{ env.PKR_VAR_aws_region }}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null | grep -q "Online"; then
              echo "SSM agent is ready"
              break
            fi
            echo "Waiting for SSM agent... ($i/30)"
            sleep 10
          done

      - name: Create assessment inventory
        run: |
          INSTANCE_ID="${{ steps.launch_instance.outputs.INSTANCE_ID }}"
          REGION="${{ env.PKR_VAR_aws_region }}"
          
          cat > /tmp/assessment_inventory.yml << EOF
          all:
            hosts:
              test_instance:
                ansible_host: ${INSTANCE_ID}
                ansible_connection: community.aws.aws_ssm
                ansible_aws_ssm_region: ${REGION}
                ansible_aws_ssm_timeout: 60
          EOF
          
          echo "Assessment inventory:"
          cat /tmp/assessment_inventory.yml

      - name: Run CIS Compliance Assessment
        run: |
          echo "=== Running CIS Compliance Assessment ==="
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
            -i /tmp/assessment_inventory.yml \
            ansible/cis-assessment.yml \
            -e "enable_cis_hardening=true" \
            -v

      - name: Terminate Assessment Instance
        if: always()
        run: |
          INSTANCE_ID="${{ steps.launch_instance.outputs.INSTANCE_ID }}"
          
          if [ -n "$INSTANCE_ID" ]; then
            echo "Terminating assessment instance: $INSTANCE_ID"
            aws ec2 terminate-instances \
              --instance-ids "$INSTANCE_ID" \
              --region "${{ env.PKR_VAR_aws_region }}" \
              --query 'TerminatingInstances[0].CurrentState.Name' \
              --output text
            echo "Instance termination initiated"
          fi