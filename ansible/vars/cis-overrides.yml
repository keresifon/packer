---
# CIS Level 2 Hardening - Variable Overrides
# These override the defaults from ansible-lockdown/AMAZON2023-CIS
# See the role's defaults/main.yml for all available options:
# https://github.com/ansible-lockdown/AMAZON2023-CIS/blob/main/defaults/main.yml

# Enable CIS Level 1 and Level 2
amzn2023cis_level1: true
amzn2023cis_level2: true

# SSH - ensure ec2-user is allowed (required for Packer/SSM connectivity)
amzn2023cis_sshd_allow_users: "ec2-user"

# Disable audit during hardening (separate assessment job handles this)
run_audit: false
setup_audit: false

# Skip controls that are unavailable or may interfere with build
amzn2023cis_config_aide: false   # AIDE not available in AL2023 base repos (disables all 1.3.x rules)
# Firewall - neither firewalld nor nftables available in AL2023 base repos
amzn2023cis_rule_3_4_1_1: false  # Ensure nftables/firewalld installed
amzn2023cis_rule_3_4_1_2: false  # Ensure single firewall utility
amzn2023cis_rule_3_4_2_1: false  # nftables/firewalld rules
amzn2023cis_rule_3_4_2_2: false
amzn2023cis_rule_3_4_2_3: false
amzn2023cis_rule_3_4_2_4: false
amzn2023cis_rule_3_4_2_5: false
amzn2023cis_rule_3_4_2_6: false
amzn2023cis_rule_3_4_2_7: false
# rsyslog - not available in AL2023 base repos (AL2023 uses journald)
amzn2023cis_rule_5_1_1_1: false  # Ensure rsyslog installed
amzn2023cis_rule_5_1_1_2: false  # rsyslog service enabled
amzn2023cis_rule_5_1_1_3: false  # rsyslog permissions
amzn2023cis_rule_5_1_1_4: false  # rsyslog logging configured
amzn2023cis_rule_5_1_1_5: false  # rsyslog remote logging
amzn2023cis_rule_5_1_1_6: false  # rsyslog not receiving remote logs
amzn2023cis_rule_5_1_1_7: false  # rsyslog not receiving remote logs
amzn2023cis_rule_5_3: false      # rsyslog-logrotate not available in AL2023
# amzn2023cis_rule_5_2_4: false   # SSH AllowUsers (we set it above)
